[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[advisories]
ignore = [
    # rsa: Marvin Attack timing sidechannel - no safe upgrade available yet
    "RUSTSEC-2023-0071",
    # protobuf: stack overflow - locked by prometheus v0.13 depending on protobuf v2
    "RUSTSEC-2024-0437",
    # proc-macro-error2: unmaintained - transitive via sea-orm and validator, no safe upgrade available
    "RUSTSEC-2026-0173",
    # crypto-bigint: timing variability in constant-time ops - needs >=0.7.6, locked by
    # jsonwebtoken v11 -> p256/p384 -> elliptic-curve v0.13, which pins crypto-bigint 0.5
    "RUSTSEC-2026-0387",
    # unsafe-libyaml: unmaintained - transitive via serde_yaml_ng (import-openapi feature),
    # and the whole serde_yaml family is deprecated, so no safe upgrade exists
    "RUSTSEC-2024-0449",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
